name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One macOS job per run: free macOS runners are limited per account, and with 2-3 jobs per run, parallel
    # PRs left jobs queued until GitHub cancelled them after 15 minutes. Unit tests, then the iPhone UI tests,
    # then (main and manual runs only) the iPad UI tests, all on one runner.
    name: Tests
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: ci/write-google-service-info.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Skarnik.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulators
        id: sim
        run: |
          # Newest available iOS runtime, first iPhone and first iPad on it.
          pick() {
            xcrun simctl list devices available -j | jq -r --arg device "$1" '
              .devices | to_entries
              | map(select(.key | test("iOS")))
              | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
              | last | .value | map(select(.name | startswith($device))) | first | .udid'
          }
          iphone=$(pick iPhone)
          ipad=$(pick iPad)
          echo "Using iPhone simulator $iphone, iPad simulator $ipad"
          echo "iphone=$iphone" >> "$GITHUB_OUTPUT"
          echo "ipad=$ipad" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Skarnik.xcodeproj \
            -scheme Skarnik \
            -destination "id=${{ steps.sim.outputs.iphone }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log

      # Issue #58: vocabulary.db (84 MB) must ship once, in the app. The widget extension reads the app's copy.
      - name: Check vocabulary.db is bundled once
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Skarnik.app
          copies=$(find "$app" -name vocabulary.db)
          echo "$copies"
          if [[ "$copies" != "$app/vocabulary.db" ]]; then
            echo "::error::vocabulary.db must be bundled only at $app/vocabulary.db (issue #58)"; exit 1
          fi

      # Issue #65: no ads, no IDFA, no ATT, so nothing in the app may link AdSupport.framework.
      # Checks every Mach-O in the bundle (app binary, Debug dylib, widget extension).
      - name: Check AdSupport is not linked
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Skarnik.app
          found=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            if otool -L "$f" | grep -q 'AdSupport.framework'; then
              echo "::error::$f links AdSupport.framework (issue #65)"; found=1
            fi
          done < <(find "$app" -type f -print0)
          exit $found

      # A failed test case is run again up to twice: on the shared simulators a slow accessibility
      # snapshot can miss a 10 s wait. A test that fails all 3 times still fails the job.
      # Runs even when the unit tests failed, so one push shows every failure.
      - name: UI tests (iPhone)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        run: ci/run-ui-tests.sh "${{ steps.sim.outputs.iphone }}" iPhone

      # The iPad suite (split view, issue #79) runs on main and manual runs only, to keep PR runs short.
      - name: UI tests (iPad)
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && github.event_name != 'pull_request' }}
        run: ci/run-ui-tests.sh "${{ steps.sim.outputs.ipad }}" iPad

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*.xcresult
            build/*.log
          if-no-files-found: ignore
          retention-days: 14
