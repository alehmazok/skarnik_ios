name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: ci/write-google-service-info.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Skarnik.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulator
        id: sim
        run: |
          # Newest available iOS runtime, first iPhone on it.
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
            | last | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Skarnik.xcodeproj \
            -scheme Skarnik \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 14

  ui-test:
    name: UI tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: ci/write-google-service-info.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Skarnik.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
            | last | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Skarnik.xcodeproj \
            -scheme SkarnikUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/UITestResults.xcresult \
            -skip-testing:SkarnikUITests/NetworkUITests \
            -skip-testing:SkarnikUITests/OfflineDictionaryUITests \
            -skip-testing:SkarnikUITests/NoNetworkUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-ui-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            build/UITestResults.xcresult
            build/xcodebuild-ui-test.log
          if-no-files-found: ignore
          retention-days: 14
