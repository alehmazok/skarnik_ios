name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: ci/write-google-service-info.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Skarnik.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulator
        id: sim
        run: |
          # Newest available iOS runtime, first iPhone on it.
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
            | last | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Skarnik.xcodeproj \
            -scheme Skarnik \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-test.log

      # Issue #58: vocabulary.db (84 MB) must ship once, in the app. The widget extension reads the app's copy.
      - name: Check vocabulary.db is bundled once
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Skarnik.app
          copies=$(find "$app" -name vocabulary.db)
          echo "$copies"
          if [[ "$copies" != "$app/vocabulary.db" ]]; then
            echo "::error::vocabulary.db must be bundled only at $app/vocabulary.db (issue #58)"; exit 1
          fi

      # Issue #65: no ads, no IDFA, no ATT, so nothing in the app may link AdSupport.framework.
      # Checks every Mach-O in the bundle (app binary, Debug dylib, widget extension).
      - name: Check AdSupport is not linked
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Skarnik.app
          found=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            if otool -L "$f" | grep -q 'AdSupport.framework'; then
              echo "::error::$f links AdSupport.framework (issue #65)"; found=1
            fi
          done < <(find "$app" -type f -print0)
          exit $found

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 14

  ui-test:
    # The iPhone job keeps the old check name. iPad runs the split view (issue #79).
    name: ${{ matrix.device == 'iPhone' && 'UI tests' || format('UI tests ({0})', matrix.device) }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: ci/write-google-service-info.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Skarnik.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r --arg device "$DEVICE" '
            .devices | to_entries
            | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
            | last | .value | map(select(.name | startswith($device))) | first | .udid')
          echo "Using $DEVICE simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
        env:
          DEVICE: ${{ matrix.device }}

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Skarnik.xcodeproj \
            -scheme SkarnikUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/UITestResults.xcresult \
            -skip-testing:SkarnikUITests/NetworkUITests \
            -skip-testing:SkarnikUITests/OfflineDictionaryUITests \
            -skip-testing:SkarnikUITests/NoNetworkUITests \
            -skip-testing:SkarnikUITests/AppStoreScreenshotsUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-ui-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.device }}
          path: |
            build/UITestResults.xcresult
            build/xcodebuild-ui-test.log
          if-no-files-found: ignore
          retention-days: 14
