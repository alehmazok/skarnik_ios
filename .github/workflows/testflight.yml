name: TestFlight

# Archives a Release build with automatic signing via the App Store Connect API key and uploads
# it to TestFlight. The archive is signed with one stored Apple Development certificate
# (DEV_CERT_P12) imported into a temporary keychain: without it, every run on a fresh runner asks
# Apple for a new development certificate and the team soon hits Apple's certificate limit.
# Export for App Store Connect uses cloud-managed distribution signing.
#   - Run manually: Actions → TestFlight → Run workflow.
#   - Pull requests that touch this pipeline do a dry run: archive + export, no upload.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (CFBundleVersion). Empty = next free number on App Store Connect.
        required: false
        type: string
      upload:
        description: Upload to TestFlight (off = archive and export only)
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/testflight.yml
      - ci/**

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: EQFFWL4KZF

jobs:
  deploy:
    name: Archive and upload
    # Same image and Xcode as the CI test job, so the archive uses the toolchain the tests ran on.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 GOOGLE_SERVICE_INFO_PLIST DEV_CERT_P12; do
            if [[ -z "${!name}" ]]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: ci/write-google-service-info.sh

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the key either base64-encoded or as the raw .p8 text.
          if [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          else
            echo "$ASC_KEY_P8" | base64 --decode > "$key_path"
          fi
          grep -q "BEGIN PRIVATE KEY" "$key_path" || { echo "::error::ASC_KEY_P8 is not a valid .p8 key"; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install development certificate
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          cert_path="$RUNNER_TEMP/dev-cert.p12"
          echo "$DEV_CERT_P12" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -f pkcs12 -P "$DEV_CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # Put the temporary keychain first in the search list so Xcode finds the identity there.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_path"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          identities=$(security find-identity -v -p codesigning "$keychain")
          echo "$identities"
          grep -q '"Apple Development' <<<"$identities" \
            || { echo "::error::DEV_CERT_P12 has no valid Apple Development identity with its private key"; exit 1; }

      - name: Resolve build number
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          settings=$(xcodebuild -project Skarnik.xcodeproj -target Skarnik -configuration Release -showBuildSettings 2>/dev/null)
          version=$(awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}' <<<"$settings")
          project_build=$(awk -F' = ' '/ CURRENT_PROJECT_VERSION = /{print $2; exit}' <<<"$settings")
          bundle_id=$(awk -F' = ' '/ PRODUCT_BUNDLE_IDENTIFIER = /{print $2; exit}' <<<"$settings")
          if [[ -n "$INPUT_BUILD_NUMBER" ]]; then
            build="$INPUT_BUILD_NUMBER"
          else
            # Next free number on App Store Connect, never below the project's own build number.
            build=$(ruby ci/next-build-number.rb "$bundle_id" "$project_build")
          fi
          echo "Building $version ($build)"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "### Skarnik $version ($build)" >> "$GITHUB_STEP_SUMMARY"

      # Crash reporting (issue #28): the DSN turns Sentry on in this build; without it the build reports nothing.
      - name: Archive
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -o pipefail
          if [[ -z "$SENTRY_DSN" ]]; then echo "::warning::SENTRY_DSN is not set: this build reports no crashes."; fi
          mkdir -p build
          xcodebuild archive \
            -project Skarnik.xcodeproj \
            -scheme Skarnik \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Skarnik.xcarchive \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SENTRY_DSN="$SENTRY_DSN" \
            | tee build/xcodebuild-archive.log

      - name: Export and upload
        env:
          UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          set -o pipefail
          cp ci/ExportOptions.plist build/ExportOptions.plist
          if [[ "$UPLOAD" == "true" ]]; then
            /usr/libexec/PlistBuddy -c "Set :destination upload" build/ExportOptions.plist
            echo "Exporting and uploading to App Store Connect"
          else
            echo "Dry run: exporting the .ipa only"
          fi
          xcodebuild -exportArchive \
            -archivePath build/Skarnik.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tee build/xcodebuild-export.log
          if [[ "$UPLOAD" == "true" ]]; then
            echo "Uploaded build $BUILD_NUMBER to TestFlight. It shows up in App Store Connect after processing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: archive and export succeeded, nothing uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Symbolicated stack traces in Sentry. Org "skarnik"; project from the repository variable SENTRY_PROJECT,
      # "skarnik_ios" by default. Without SENTRY_AUTH_TOKEN the script only warns.
      - name: Upload dSYMs to Sentry
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'skarnik_ios' }}
        run: ci/sentry-upload-dsyms.sh build/Skarnik.xcarchive/dSYMs

      - name: Upload dSYMs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skarnik-${{ env.BUILD_NUMBER }}
          path: |
            build/Skarnik.xcarchive/dSYMs
            build/*.log
            build/export/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove API key and keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
